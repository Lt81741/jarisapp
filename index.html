<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. AI Assistant</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #00ffff;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .jarvis-container {
            max-width: 600px;
            margin: 40px auto;
            background: rgba(11, 25, 40, 0.9);
            border: 2px solid #00ffff;
            box-shadow: 0 0 20px #00ffff;
            border-radius: 15px;
            padding: 30px;
        }
        h1 {
            letter-spacing: 3px;
            text-shadow: 0 0 10px #00ffff;
        }
        .mic-btn {
            background: transparent;
            border: 2px solid #00ffff;
            color: #00ffff;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 10px #00ffff;
            transition: 0.3s;
            margin: 20px 0;
        }
        .mic-btn:hover {
            background: #00ffff;
            color: #0b0f19;
            box-shadow: 0 0 25px #00ffff;
        }
        #chat-box {
            background: #04070d;
            border: 1px solid #005f73;
            border-radius: 8px;
            padding: 15px;
            height: 250px;
            overflow-y: auto;
            text-align: left;
            margin-top: 20px;
            font-size: 14px;
            line-height: 1.5;
        }
        .user-msg { color: #ff9f1c; margin-bottom: 10px; }
        .ai-msg { color: #00f5d4; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="jarvis-container">
        <h1>J.A.R.V.I.S. v1.0</h1>
        <p>System Online. Ready for voice command.</p>
        
        <button class="mic-btn" onclick="startJarvis()">🎙️ SPEAK TO JARVIS</button>
        
        <div id="chat-box">
            <div class="ai-msg"><b>Jarvis:</b> Sir, systems are online. How can I assist you today?</div>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById("chat-box");

        function appendMessage(sender, text, className) {
            chatBox.innerHTML += `<div class="${className}"><b>${sender}:</b> ${text}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function startJarvis() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Voice recognition is not supported on this browser. Please use Google Chrome.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN'; // हिंदी और अंग्रेजी दोनों के लिए
            recognition.interimResults = false;

            appendMessage("System", "Listening...", "user-msg");

            recognition.onresult = function(event) {
                const userSpeech = event.results[0][0].transcript;
                appendMessage("You", userSpeech, "user-msg");
                sendToLocalAI(userSpeech);
            };

            recognition.onerror = function() {
                appendMessage("System", "Could not catch that. Try again.", "user-msg");
            };

            recognition.start();
        }

        async function sendToLocalAI(prompt) {
            appendMessage("Jarvis", "Processing...", "ai-msg");
            
            try {
                // यहाँ आपके PC का लोकल IP एड्रेस या localhost डलेगा
                const response = await fetch("http://localhost:11434/api/generate", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "llama3",
                        prompt: prompt,
                        stream: false
                    })
                });

                const data = await response.json();
                const reply = data.response || "Sir, I didn't get any response.";
                
                // पुरानी 'Processing...' वाली लाइन हटाकर असली जवाब जोड़ें
                chatBox.lastChild.remove();
                appendMessage("Jarvis", reply, "ai-msg");
                
                speakJarvis(reply);

            } catch (error) {
                chatBox.lastChild.remove();
                appendMessage("Jarvis", "Error: Unable to connect to local server.", "ai-msg");
            }
        }

        function speakJarvis(text) {
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = 'hi-IN';
            window.speechSynthesis.speak(speech);
        }
    </script>

</body>
</html>
